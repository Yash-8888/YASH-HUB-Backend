name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync code to deploy directory
        run: |
          rsync -av --exclude='.env' --exclude='venv' --exclude='__pycache__' \
            $GITHUB_WORKSPACE/ /home/yash/apps/CandyHub-full/CandyHub/backend/

      - name: Rebuild backend container
        run: |
          cd /home/yash/apps/CandyHub-full/CandyHub
          docker compose up -d --build --no-deps backend

      - name: Ensure tables exist
        run: |
          cd /home/yash/apps/CandyHub-full/CandyHub
          sleep 5
          docker compose exec -T backend python -c "from app.database.session import Base, engine; from app.models import *; Base.metadata.create_all(bind=engine)"